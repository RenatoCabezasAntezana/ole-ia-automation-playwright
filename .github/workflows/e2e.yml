name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tags (ej: @smoke, @login)'
        required: false
        default: ''

jobs:
  e2e:
    name: Run E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        id: run-tests
        env:
          ENV_NAME: dev
          BASE_URL: ${{ secrets.BASE_URL }}
          HEADLESS: 'true'
          TIMEOUT: '30000'
          STANDARD_USER: ${{ secrets.STANDARD_USER }}
          STANDARD_PASSWORD: ${{ secrets.STANDARD_PASSWORD }}
          LOCKED_USER: ${{ secrets.LOCKED_USER }}
          LOCKED_PASSWORD: ${{ secrets.LOCKED_PASSWORD }}
          CUCUMBER_PUBLISH_TOKEN: ${{ secrets.CUCUMBER_PUBLISH_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.tags }}" ]; then
            npm run test:dev -- --tags "${{ github.event.inputs.tags }}"
          else
            npm run test:dev
          fi

      - name: Deploy report to Surge
        if: always()
        run: |
          cp reports/cucumber-report.html reports/index.html
          npm install -g surge
          surge reports/ ole-ia-automation-playwright.surge.sh --token ${{ secrets.SURGE_TOKEN }}

      - name: Upload evidence screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: reports/evidence/
          retention-days: 30
          if-no-files-found: ignore

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            {
              "run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "branch": "${{ github.ref_name }}",
              "status": "${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}",
              "resultado": "<https://ole-ia-automation-playwright.surge.sh|📊 Ver Reporte>"
            }
